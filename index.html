<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HLU Dorm Drink</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3faf8;--card:#fff;--ink:#12343b;--mute:#5d7a80;--pri:#0e8a7d;--onpri:#fff;--acc:#ffd23f;--line:#d6e8e4;--bad:#c93a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1f22;--card:#142b2f;--ink:#e6f3f1;--mute:#93b0b3;--pri:#2cc4b2;--onpri:#08201d;--line:#25444a;--bad:#ff7a7a}}
:root[data-theme="dark"]{--bg:#0d1f22;--card:#142b2f;--ink:#e6f3f1;--mute:#93b0b3;--pri:#2cc4b2;--onpri:#08201d;--line:#25444a;--bad:#ff7a7a}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 "Be Vietnam Pro",system-ui,sans-serif;padding-bottom:76px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px}
.logo{font-weight:800;font-size:18px;color:var(--pri);background:none;border:0;padding:0}
.logo small{display:block;font-weight:400;font-size:10px;color:var(--mute)}
header nav{display:none;gap:4px;margin-left:auto}
.ic{position:relative;background:none;border:1px solid var(--line);border-radius:10px;padding:7px 11px}
.sp{margin-left:auto}header nav+.ic{margin-left:0}
.badge{position:absolute;top:-6px;right:-6px;background:var(--acc);color:#12343b;border-radius:99px;font-size:11px;font-weight:800;min-width:19px;height:19px;display:grid;place-items:center}
.tab{background:none;border:0;padding:8px 12px;border-radius:8px;font-weight:600;color:var(--mute)}
.tab.on{color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,transparent)}
main{max-width:1000px;margin:0 auto;padding:16px}
.hero{background:var(--pri);color:var(--onpri);border-radius:18px;padding:28px 22px;margin-bottom:18px;position:relative;overflow:hidden}
.hero h1{margin:0 0 6px;font-size:clamp(24px,5vw,38px);line-height:1.15;font-weight:800;max-width:14ch}
.hero p{margin:0 0 16px;opacity:.9}.hero .big{position:absolute;right:14px;bottom:-10px;font-size:92px;opacity:.9}
.btn{background:var(--pri);color:var(--onpri);border:0;border-radius:10px;padding:11px 18px;font-weight:700}
.btn.acc{background:var(--acc);color:#12343b}.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.bad{background:var(--bad);color:#fff}.btn.sm{padding:6px 11px;font-size:13px}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.full{width:100%;padding:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h2{margin:6px 0 12px;font-size:20px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.img{position:relative;aspect-ratio:1.2;display:grid;place-items:center;background:hsl(var(--h) 60% 88%);font-size:52px;cursor:pointer}
@media(prefers-color-scheme:dark){.img{background:hsl(var(--h) 35% 24%)}}
.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.cb b{font-weight:600}.cat{font-size:12px;color:var(--mute)}.price{font-weight:800;color:var(--pri)}
.tag{font-size:12px;font-weight:600}.tag.ok{color:var(--pri)}.tag.no{color:var(--bad)}
.cb .btn{margin-top:auto}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px}.row .grow{flex:1;min-width:0}
.th{width:56px;height:56px;border-radius:10px;display:grid;place-items:center;font-size:28px;background:hsl(var(--h) 60% 88%);position:relative;overflow:hidden;flex:none}
@media(prefers-color-scheme:dark){.th{background:hsl(var(--h) 35% 24%)}}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px}
.qty button{background:none;border:0;width:34px;height:34px;font-size:18px}.qty span{min-width:26px;text-align:center;font-weight:600}
.empty{text-align:center;color:var(--mute);padding:40px 12px}
.sum{display:flex;justify-content:space-between;padding:4px 0}.sum.t{font-size:18px;font-weight:800;border-top:1px dashed var(--line);margin-top:6px;padding-top:10px}
.f{display:grid;gap:10px}.f label{font-size:13px;font-weight:600;display:grid;gap:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tl{display:flex;margin:12px 0 4px}.tl div{flex:1;text-align:center;font-size:11px;color:var(--mute);position:relative}
.tl div::before{content:"";display:block;width:14px;height:14px;border-radius:50%;background:var(--line);margin:0 auto 4px;position:relative;z-index:1}
.tl div::after{content:"";position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--line)}.tl div:first-child::after{display:none}
.tl .d{color:var(--ink)}.tl .d::before,.tl .d::after{background:var(--pri)}
.tl .now{font-weight:700;color:var(--pri)}.tl .now::before{box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 25%,transparent)}
.hint{background:color-mix(in srgb,var(--pri) 10%,transparent);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:13px}.hint.x{background:color-mix(in srgb,var(--bad) 12%,transparent)}
.pick{width:22px;height:22px;padding:0;accent-color:var(--pri);flex:none}.row.off{opacity:.6}
.ac{position:relative}.acl{position:absolute;left:0;right:0;top:100%;z-index:6;max-height:190px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-top:2px}
.acl button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px}.acl button:hover,.acl button:focus-visible{background:color-mix(in srgb,var(--pri) 12%,transparent)}
.st{font-weight:700;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--acc);color:#12343b}.st.x{background:var(--bad);color:#fff}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:grid;place-items:end center}
.modal{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
@media(min-width:640px){.ov{place-items:center}.modal{border-radius:18px}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}.stats b{display:block;font-size:22px;color:var(--pri)}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mute);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:var(--pri);border-radius:6px 6px 0 0;min-height:2px}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;z-index:30;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.bn{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.bn button{flex:1;background:none;border:0;padding:8px 0;font-size:11px;color:var(--mute);position:relative}.bn button span{display:block;font-size:20px}.bn button.on{color:var(--pri);font-weight:700}
.bn .badge{top:2px;right:calc(50% - 22px)}
footer{text-align:center;color:var(--mute);font-size:12px;padding:16px}footer button{background:none;border:0;color:var(--mute);text-decoration:underline}
.sk{height:200px;border-radius:14px;background:var(--line);opacity:.6}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}.bn{display:none}header nav{display:flex}body{padding-bottom:0}.sp{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<header>
 <button class="logo" data-go="home">HLU Dorm Drink<small>Cửa hàng nước ký túc xá Đại học Hạ Long</small></button>
 <nav id="nav"></nav><span class="sp"></span>
 <button class="ic" data-go="search" aria-label="Tìm kiếm">🔍</button>
 <button class="ic" data-go="cart" aria-label="Giỏ hàng">🛒<span class="badge" id="cnt">0</span></button>
</header>
<main id="app"></main>
<footer>Demo cho sinh viên KTX · <button data-go="admin">Dành cho người bán</button></footer>
<div class="bn" id="bn"></div><div id="toast"></div><div id="modal"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===== SUPABASE =====
   Điền Project URL và Publishable key của bạn vào 2 dòng dưới.
   KHÔNG dùng Secret key trong file này.
*/
const SUPABASE_URL = 'https://idszlkwsrovlwvptgcky.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_YR5eRlbq9QVWGSSpEExmqA_ND5bPfU_';
const supabaseEnabled =
  SUPABASE_URL.startsWith('https://') &&
    !SUPABASE_URL.includes('YOUR_SUPABASE_URL') &&
  SUPABASE_PUBLISHABLE_KEY.startsWith('sb_') &&
    !SUPABASE_PUBLISHABLE_KEY.includes('YOUR_SUPABASE_PUBLISHABLE_KEY');

/* Khung xem trước (iframe) không gửi được đối tượng Headers nên báo DataCloneError.
   Đổi Headers thành object thường trước khi gọi fetch; ở trang thật việc này vô hại. */
const plainFetch=(url,opt={})=>{const o={...opt};if(o.headers&&typeof o.headers.entries==='function')o.headers=Object.fromEntries(o.headers.entries());return fetch(url,o)};
const sb = supabaseEnabled
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {global:{fetch:plainFetch}})
  : null;

/* ===== DỮ LIỆU MẪU: sửa sản phẩm ở đây (emoji = ảnh tạm, image = link ảnh thật) ===== */
const CATS=['Nước suối','Nước ngọt','Nước trái cây','Sữa','Cà phê','Trà','Đồ uống khác'];
const HUE={'Nước suối':195,'Nước ngọt':10,'Nước trái cây':35,'Sữa':50,'Cà phê':25,'Trà':130,'Đồ uống khác':280};
const STEPS=['Đang xử lý','Đã xác nhận','Đang giao','Đã giao'];
/* Lời giải thích từng trạng thái cho khách (chỉ để hiển thị, KHÔNG lưu vào database) */
const HELP={'Đang xử lý':'Cửa hàng đã nhận đơn và sẽ xác nhận sớm. Bạn vẫn có thể hủy đơn ở bước này.','Đã xác nhận':'Cửa hàng đã xác nhận và đang chuẩn bị nước cho bạn.','Đang giao':'Nước đang được mang đến cho bạn. Hãy để ý điện thoại nhé.','Đã giao':'Đơn đã hoàn tất. Cảm ơn bạn!','Đã hủy':'Đơn này đã được hủy.'};
/* ===== KHU / TÒA / PHÒNG =====
   Mỗi khu có một tòa cùng tên. Số phòng do khách tự nhập: 5 tầng, mỗi tầng 12 phòng (101-112, 201-212, ... 501-512). */
const DORM={'Khu S1':['S1'],'Khu S2':['S2'],'Khu S3':['S3'],'Khu S4':['S4']};
const FLOORS=5,PER_FLOOR=12;
const ROOMS=[];for(let f=1;f<=FLOORS;f++)for(let n=1;n<=PER_FLOOR;n++)ROOMS.push(f+String(n).padStart(2,'0'));
const buildingsOf=a=>Array.isArray(DORM[a])?DORM[a]:[];
const validRoom=r=>ROOMS.includes(r);
const SEED=[['Aquafina 500ml',5000,'Nước suối','💧',80,'Nước tinh khiết, mát lạnh.'],['Lavie 500ml',5000,'Nước suối','💧',80,'Nước khoáng thiên nhiên.'],
['Coca-Cola 390ml',10000,'Nước ngọt','🥤',40,'Vị cola quen thuộc, uống lạnh là đỉnh.'],['Pepsi 390ml',10000,'Nước ngọt','🥤',40,'Sảng khoái, sủi bọt.'],
['Sting đỏ 330ml',10000,'Nước ngọt','⚡',30,'Nước tăng lực cho đêm ôn thi.'],['C2 trà xanh',10000,'Trà','🍵',35,'Trà xanh chai, vị thanh nhẹ.'],
['Trà đào',12000,'Trà','🍑',25,'Trà đào mát lạnh, thơm ngọt.'],['Nước cam',12000,'Nước trái cây','🍊',20,'Nước cam ép giàu vitamin C.'],
['Milo',12000,'Sữa','🥛',30,'Sữa lúa mạch Milo, thơm béo.'],['Cà phê lon',15000,'Cà phê','☕',25,'Cà phê lon tỉnh táo cả buổi học.']]
.map((a,i)=>({id:i+1,name:a[0],price:a[1],cat:a[2],emoji:a[3],stock:a[4],desc:a[5],image:'',available:true}));

/* ===== LƯU TRỮ =====
   Giỏ hàng vẫn lưu trên trình duyệt.
   Sản phẩm + đơn hàng dùng Supabase khi đã cấu hình.
*/
const K={c:'hlu_cart',o:'hlu_cart_off',m:'hlu_my_tokens'}; // giỏ hàng, sản phẩm bỏ tích, mã đơn đã đặt trên máy này
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const S={products:SEED,cart:load(K.c,{}),off:load(K.o,{}),orders:[],mine:[],myTokens:(x=>Array.isArray(x)?x.filter(t=>/^[0-9a-f-]{36}$/i.test(t)):[])(load(K.m,[])),ask:null,user:null,busy:false,view:'home',cat:'Tất cả',q:'',loading:true,tab:'dash',confirm:null,lastOrder:null};
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>n.toLocaleString('vi-VN')+'đ';
const inStock=p=>p.available&&p.stock>0;
const byId=id=>S.products.find(p=>p.id===id);
const cartItems=()=>Object.entries(S.cart).map(([id,q])=>({p:byId(+id),q})).filter(x=>x.p);
const cartCount=()=>cartItems().reduce((s,x)=>s+x.q,0);
/* Sản phẩm được tích ☑ để mua (mặc định là tích; sản phẩm hết hàng thì không đặt được) */
const isSel=id=>!S.off[id];
const selItems=()=>cartItems().filter(({p})=>isSel(p.id)&&inStock(p));
const selCount=()=>selItems().reduce((s,x)=>s+x.q,0);
const selTotal=()=>selItems().reduce((s,x)=>s+x.p.price*x.q,0);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}
const pic=(p,c)=>`<div class="${c}" style="--h:${HUE[p.cat]||180}"><span>${esc(p.emoji||'🥤')}</span>${p.image?`<img src="${esc(p.image)}" alt="" onerror="this.remove()">`:''}</div>`;


/* ===== SUPABASE DATA ===== */
/* Lỗi của Supabase là object nên in ra thành "[object Object]"; hàm này đổi thành chữ dễ đọc (mã lỗi + nội dung) */
const errText=e=>e&&e.message?(e.code?e.code+': ':'')+e.message+(e.details?' | '+e.details:'')+(e.hint?' | '+e.hint:''):String(e);
function productFromDb(p){
  return {
    id:p.id, name:p.name, price:Number(p.price)||0,
    cat:p.category||'Đồ uống khác', emoji:p.emoji||'🥤',
    stock:Number(p.stock)||0, desc:p.description||'',
    image:p.image||'', available:p.available!==false
  };
}
function orderFromDb(o){
  return {
    id:'HLU'+String(o.id).padStart(6,'0'), dbId:o.id, token:o.token,
    time:new Date(o.created_at).getTime(),
    items:parseItems(o.items),
    total:Number(o.total)||0, status:o.status||'Đang xử lý',
    info:{
      name:o.customer_name||'', phone:o.phone||'',
      area:o.dorm_area||'', building:o.building||'',
      room:o.room||'', note:o.note||'',
      method:o.delivery_method||'', pay:o.payment_method||''
    }
  };
}
/* Đọc cột items: hỗ trợ mảng, chuỗi JSON (đơn mới) và chuỗi cũ dạng "Tên (2), Tên (1)" */
function parseItems(raw){
  if(Array.isArray(raw))return raw;
  if(typeof raw==='string'&&raw.trim()){
    try{const v=JSON.parse(raw);if(Array.isArray(v))return v}catch(e){}
    return raw.split(/\),\s*/).map(s=>{const m=s.match(/^(.*?)\s*\((\d+)\)?$/);return m?{name:m[1],qty:+m[2]}:{name:s,qty:1}});
  }
  return [];
}
async function loadRemoteData(){
  if(!sb){S.loading=false;return;}
  try{
    const {data:products,error:pe}=await sb.from('products').select('*').order('id');
    if(pe) throw pe;
    S.products=(products||[]).map(productFromDb);
  }catch(err){
    console.error('Supabase:',errText(err));
    toast('Lỗi máy chủ'+(err&&err.code?' ('+err.code+')':'')+'. Mở Console (F12) để xem chi tiết.');
  }finally{
    S.loading=false;
    render();
  }
}
/* Đơn của MÁY NÀY: chỉ lấy các đơn có mã đã lưu lúc khách đặt hàng */
async function refreshMine(){
  if(!sb)return;
  if(!S.myTokens.length){S.mine=[];return}
  const {data,error}=await sb.rpc('my_orders',{p_tokens:S.myTokens});
  if(error)throw error;
  S.mine=(data||[]).map(orderFromDb);
}
/* Đơn của TẤT CẢ khách: chỉ dùng cho trang quản trị */
async function loadAllOrders(){
  if(!sb)return;
  const {data,error}=await sb.from('orders').select('*').order('created_at',{ascending:false});
  if(error)throw error;
  S.orders=data.map(orderFromDb);
}
/* Vào trang nào thì tải dữ liệu của trang đó */
function enter(v){
  if(!sb)return;
  const done=()=>{if(S.view===v)render()},fail=e=>{console.error(errText(e));toast('Không tải được đơn hàng.')};
  if(v==='orders'){S.busy=true;render();refreshMine().catch(fail).finally(()=>{S.busy=false;done()})}
  if(v==='admin'&&S.user)loadAllOrders().catch(fail).finally(done);
}
/* Tự cập nhật trạng thái đơn mỗi 30 giây khi khách đang xem trang Đơn hàng */
setInterval(()=>{if(sb&&S.view==='orders'&&!document.hidden)refreshMine().then(()=>S.view==='orders'&&render()).catch(()=>{})},30000);
async function insertOrderRemote(o){
  const {data,error}=await sb.rpc('create_order',{
    p_name:o.info.name,p_phone:o.info.phone,p_area:o.info.area,p_building:o.info.building,p_room:o.info.room,
    p_note:o.info.note||'',p_method:o.info.method,p_pay:o.info.pay,
    p_items:o.items.map(i=>({id:i.id,qty:i.qty})) // giá, tổng tiền và trừ kho do máy chủ tự làm
  });
  if(error) throw error;
  return orderFromDb(Array.isArray(data)?data[0]:data);
}
/* Lấy tồn kho mới nhất từ database trước khi đặt hàng */
async function syncStock(ids){
  const {data,error}=await sb.from('products').select('id,stock,available').in('id',ids);
  if(error)throw error;
  data.forEach(r=>{const p=byId(r.id);if(p){p.stock=Number(r.stock)||0;p.available=r.available!==false}});
  const got=new Set(data.map(r=>r.id));
  ids.forEach(id=>{if(!got.has(id)){const p=byId(id);if(p)p.available=false}}); // sản phẩm đã bị xóa
}
/* Có Supabase: tồn kho do MÁY CHỦ tự trừ/cộng (create_order, cancel_my_order, admin_set_status).
   Hai hàm adjustStock và restock chỉ dùng cho chế độ demo không có Supabase. */
function adjustStock(id,delta){const p=byId(id);if(p)p.stock=Math.max(0,p.stock+delta)}
function restock(items){items.forEach(it=>{const p=it.id?byId(it.id):S.products.find(x=>x.name.trim()===String(it.name).trim());if(p)adjustStock(p.id,Number(it.qty)||0)})}
async function loadProducts(){
  const {data,error}=await sb.from('products').select('*').order('id');
  if(error)throw error;
  S.products=data.map(productFromDb);
}
/* Đổi trạng thái đơn (trang quản trị). Trả về false nếu đơn đã bị đổi trước đó. */
async function setOrderStatus(o,st,onlyFrom){
  if(onlyFrom&&o.status!==onlyFrom)return false;
  if(sb){
    const {data,error}=await sb.rpc('admin_set_status',{p_id:o.dbId,p_from:o.status,p_status:st});
    if(error)throw error;
    if(!data)return false;
    o.status=st;if(st==='Đã hủy')await loadProducts();
    return true;
  }
  const was=o.status;o.status=st;if(st==='Đã hủy'&&was!=='Đã hủy')restock(o.items);
  return true;
}
/* Khách tự hủy đơn: chỉ được khi cửa hàng chưa xác nhận */
async function cancelMine(key){
  const o=S.mine.find(o=>orderKey(o)===key);if(!o||o.status!=='Đang xử lý')return;
  try{
    let done=true;
    if(sb){const {data,error}=await sb.rpc('cancel_my_order',{p_token:o.token});if(error)throw error;done=!!data;if(done)await loadProducts()}
    else{o.status='Đã hủy';restock(o.items)}
    if(done)toast('Đã hủy đơn '+o.id+'.');
    else{toast('Cửa hàng đã xác nhận đơn nên không thể hủy.');await refreshMine()}
  }catch(err){console.error(errText(err));toast('Không hủy được đơn. Vui lòng thử lại.')}
  render();
}

 if(x=g('data-inc'))return setQty(+x.dataset.inc,(S.cart[x.dataset.inc]||0)+1);
 if(x=g('data-dec'))return setQty(+x.dataset.dec,(S.cart[x.dataset.dec]||0)-1);
 if(x=g('data-rm'))return setQty(+x.dataset.rm,0);
 if(x=g('data-tab')){S.tab=x.dataset.tab;return render()}
 if(x=g('data-edit'))return productForm(+x.dataset.edit);
 if(x=g('data-del')){const id=+x.dataset.del;if(S.confirm===id){
   (async()=>{
     try{
       if(sb) await deleteProductRemote(id);
       S.products=S.products.filter(p=>p.id!==id);delete S.cart[id];save(K.c,S.cart);
       S.confirm=null;toast('Đã xóa sản phẩm.');render();
     }catch(err){console.error(errText(err));toast('Không xóa được sản phẩm.');}
   })();
 }else S.confirm=id;return render()}
 if(x=g('data-cancel')){const key=x.dataset.cancel;if(S.ask!==key){S.ask=key;return render()}S.ask=null;return cancelMine(key)} // bấm 2 lần để hủy
 if(g('data-cancel-no')){S.ask=null;return render()}
 if(g('data-logout')){sb.auth.signOut().finally(()=>{S.user=null;S.orders=[];render()});return}
 if(x=g('data-reload')){const all=x.dataset.reload==='all';(all?loadAllOrders():refreshMine()).then(()=>{toast('Đã cập nhật.');render()}).catch(err=>{console.error(errText(err));toast('Không tải được đơn hàng.')});return}
 if(x=g('data-st')){const[id,st]=x.dataset.st.split('|');const o=S.orders.find(o=>o.id===id);if(!o)return;
   (async()=>{
     try{
       if(await setOrderStatus(o,st,o.status))toast('Đã cập nhật: '+st);
       else{toast('Đơn vừa được thay đổi nơi khác. Đã tải lại danh sách.');await loadAllOrders()}
     }catch(err){console.error(errText(err));toast('Không cập nhật được đơn hàng.');}
     render();
   })();
   return}
});
document.addEventListener('change',e=>{const t=e.target,f=t.form;
 /* Ô ☑ trong giỏ hàng: chỉ ghi nhớ sản phẩm nào KHÔNG được tích */
 if(t.hasAttribute('data-pick')||t.hasAttribute('data-all')){
   const ids=t.hasAttribute('data-all')?cartItems().filter(({p})=>inStock(p)).map(({p})=>p.id):[+t.dataset.pick];
   ids.forEach(id=>{if(t.checked)delete S.off[id];else S.off[id]=true});
   save(K.o,S.off);render();
   const again=t.dataset.pick&&$('[data-pick="'+t.dataset.pick+'"]');if(again)again.focus();return}
 /* Chọn Khu thì danh sách Tòa tự cập nhật (khu chỉ có 1 tòa thì chọn sẵn) */
 if(f&&f.id==='co'&&t.name==='area'){
   const b=f.elements.building,arr=buildingsOf(t.value);
   b.innerHTML='<option value="">Chọn tòa</option>'+arr.map(v=>'<option>'+esc(v)+'</option>').join('');
   b.disabled=!arr.length;if(arr.length===1)b.value=arr[0]}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;$('#grid').innerHTML=gridHTML()}});
/* Ô Phòng: để trống, khi khách gõ thì hiện danh sách các phòng bắt đầu bằng số đã gõ (101-112, 201-212, ... 501-512) */
document.addEventListener('input',e=>{const t=e.target;if(t.name!=='room'||!t.form||t.form.id!=='co')return;
 const v=t.value.replace(/\D/g,'').slice(0,3),box=t.form.querySelector('.acl'),arr=ROOMS.filter(n=>n.startsWith(t.value.replace(/\D/g,'').slice(0,3)));t.value=v;
 box.innerHTML=v&&!(arr.length===1&&arr[0]===v)?arr.map(n=>`<button type="button" data-room="${n}">${n}</button>`).join(''):'';
 box.hidden=!box.innerHTML});
document.addEventListener('submit',e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
 if(e.target.id==='co'){
   const fail=m=>{$('#err').textContent=m},btn=e.target.querySelector('.btn.full');
   f.name=f.name.trim();f.note=(f.note||'').trim();f.phone=f.phone.trim();
   if(!f.name)return fail('Vui lòng nhập họ và tên.');
   if(!/^0\d{9}$/.test(f.phone))return fail('Số điện thoại cần 10 chữ số, bắt đầu bằng 0.');
   f.room=f.room.trim();
   if(!buildingsOf(f.area).includes(f.building))return fail('Vui lòng chọn lại Khu và Tòa trong danh sách.');
   if(!validRoom(f.room))return fail('Số phòng không hợp lệ. Phòng gồm 101-112, 201-212, ... 501-512.');
   const it=selItems();if(!it.length)return fail('Bạn chưa chọn sản phẩm nào để đặt.');
   btn.disabled=true;fail(''); // khóa nút để không đặt trùng đơn
   (async()=>{
     let order;
     try{
       if(sb)await syncStock(it.map(x=>x.p.id));
       if(it.some(({p,q})=>q>p.stock||!inStock(p))){fail('Có sản phẩm đã hết hoặc không đủ hàng. Vui lòng kiểm tra lại giỏ hàng.');btn.disabled=false;return}
       order={id:'',time:Date.now(),items:it.map(({p,q})=>({id:p.id,name:p.name,price:p.price,qty:q})),total:selTotal(),info:f,status:'Đang xử lý'};
       if(sb){const items=order.items;order=await insertOrderRemote(order);order.items=items;S.myTokens=[order.token,...S.myTokens].slice(0,50);save(K.m,S.myTokens)}
       else order.id='HLU'+Date.now().toString().slice(-6);
     }catch(err){console.error(errText(err));fail(err&&err.code==='P0001'?err.message:'Không thể gửi đơn hàng lên máy chủ. Vui lòng thử lại.');btn.disabled=false;return}
     /* Từ đây đơn đã được tạo: lỗi trừ kho chỉ ghi log, không bắt khách đặt lại */
     if(sb){try{await loadProducts()}catch(err){console.error(errText(err))}}else it.forEach(({p,q})=>adjustStock(p.id,-q)); // có Supabase: máy chủ đã tự trừ kho
     S.mine.unshift(order);if(!sb)S.orders.unshift(order);
     it.forEach(({p})=>{delete S.cart[p.id];delete S.off[p.id]}); // chỉ xóa món đã đặt, món không tích vẫn ở trong giỏ
     save(K.c,S.cart);save(K.o,S.off);S.lastOrder=order;render();
   })();
 }
 if(e.target.id==='login'){
   const btn=e.target.querySelector('.btn.full'),m=$('#lerr');btn.disabled=true;m.textContent='';
   (async()=>{
     try{
       const {data,error}=await sb.auth.signInWithPassword({email:f.email.trim(),password:f.password});
       if(error)throw error;
       const {data:isAdmin,error:ae}=await sb.rpc('is_admin');
       if(ae)throw ae;
       if(!isAdmin){await sb.auth.signOut();S.user=null;m.textContent='Tài khoản này không có quyền quản trị.';btn.disabled=false;return}
       S.user=data.user;await loadAllOrders();render();
     }catch(err){console.error(errText(err));m.textContent='Email hoặc mật khẩu chưa đúng.';btn.disabled=false}
   })();
 }
 if(e.target.id==='pf'){
   const id=+f.id,d={name:f.name.trim(),price:+f.price,stock:+f.stock,cat:f.cat,emoji:f.emoji||'🥤',image:f.image.trim(),desc:f.desc,available:!!f.available};
   (async()=>{
     try{
       if(sb){
         if(id){const updated=await updateProductRemote({...d,id});Object.assign(byId(id),updated);}
         else{const created=await insertProductRemote(d);S.products.push(created);}
       }else{
         if(id)Object.assign(byId(id),d);
         else S.products.push({id:Math.max(0,...S.products.map(p=>p.id))+1,...d});
       }
       $('#modal').innerHTML='';toast('Đã lưu sản phẩm.');render();
     }catch(err){console.error(errText(err));toast('Không lưu được sản phẩm.');}
   })();
 }
});

S.view=location.hash.slice(1)||'home';render();
loadRemoteData();
initAuth().finally(()=>enter(S.view));
</script></body></html>
